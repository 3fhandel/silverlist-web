<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Wochenangebot</title><style>body{margin:0;background:#eef1f6;font:16px system-ui;color:#172033}.summary{max-width:50rem;margin:2rem auto;padding:1.5rem;background:#fff;border-radius:1rem}.summary h1{margin-top:0}.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.6rem}.item{padding:.7rem;border:1px solid #dde3ed;border-radius:.6rem}.item small{display:block;color:#667085;margin-bottom:.2rem}</style></head><body><main class="summary"><h1>Wochenangebot</h1><p>{{ validity }} · {{ products|length }} Artikel · Design {{ design }}</p><div class="items">{% for product in products %}<div class="item"><small>{{ product.slot }}</small><strong>{{ product.description }}</strong><br>{{ product.price }} € / {{ product.unit }}</div>{% endfor %}</div></main></body></html>
