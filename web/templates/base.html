{% load static %}<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}SilverLists Web{% endblock %}</title>
<style>
:root{--ink:#162033;--muted:#677189;--line:#dde3ed;--brand:#2864dc;--brand2:#6b4eff;--surface:#fff;--bg:#f4f6fb;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:radial-gradient(circle at 15% 0,#e8efff 0,transparent 30rem),var(--bg)}a{color:var(--brand);text-decoration:none}main{max-width:72rem;margin:auto;padding:2.25rem 1.5rem 6rem}.topbar{display:flex;align-items:center;gap:.7rem;margin-bottom:3.5rem}.brand-logo{display:block;width:clamp(13rem,24vw,18rem);height:auto}.topbar-actions{margin-left:auto;position:relative}.settings-button{display:grid;place-items:center;width:2.5rem;height:2.5rem;padding:0;border:1px solid var(--line);border-radius:.7rem;background:rgba(255,255,255,.8);color:var(--ink);cursor:pointer;font-size:1.2rem}.settings-button:hover{background:#fff;border-color:#aebbd2}.settings-popover{position:absolute;z-index:5;right:0;top:3rem;width:min(23rem,calc(100vw - 3rem));padding:1rem;border:1px solid var(--line);border-radius:1rem;background:#fff;box-shadow:0 18px 55px rgba(32,48,85,.16);font-weight:400}.settings-popover strong{font-weight:750}.settings-popover p{margin:.35rem 0;color:var(--muted);font-size:.9rem}.settings-popover .button{margin-top:.6rem}.page-head{max-width:45rem;margin-bottom:2rem}.page-head h1{font-size:clamp(2.2rem,5vw,4rem);line-height:1.02;letter-spacing:-.05em;margin:.35rem 0 1rem}.page-head p,.muted{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:var(--brand);font-size:.75rem;font-weight:800}
.dashboard-head{max-width:52rem;margin-bottom:1.75rem}.dashboard-head h1{font-size:clamp(2rem,4vw,3rem);line-height:1.12;letter-spacing:-.035em;margin:.5rem 0 .75rem}.dashboard-head p{max-width:46rem;font-size:1.02rem;line-height:1.6;margin:0}.panel,.empty,.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:1rem;padding:1.25rem;box-shadow:0 10px 35px rgba(32,48,85,.06)}.dropzone{display:grid;place-items:center;text-align:center;min-height:18rem;border:1.5px dashed #aebbd2;border-radius:.75rem;padding:2rem;transition:.2s;background:#fbfcff}.dropzone.drag{border-color:var(--brand);background:#eef4ff;transform:translateY(-2px)}.drop-icon{display:grid;place-items:center;width:3rem;height:3rem;margin:auto;border-radius:.8rem;background:#edf2fb;color:var(--brand);font-size:1.75rem}.dropzone h2{margin:.9rem 0 .3rem;font-size:1.25rem}.dropzone input{position:absolute;inline-size:1px;block-size:1px;opacity:0}.button,.primary,.secondary{display:inline-flex;align-items:center;gap:.45rem;border:0;border-radius:.7rem;background:var(--ink);color:#fff;padding:.8rem 1.15rem;font:inherit;font-weight:750;cursor:pointer;margin-top:1rem}.primary{background:linear-gradient(135deg,var(--brand),var(--brand2))}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.secondary:hover{border-color:#aebbd2;background:#f8fafc}.filename{color:var(--brand);font-weight:750;margin-top:.7rem}.errors{color:#a72d35}
.integration{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem;padding:1rem 1.2rem;border:1px solid #e0a42e;border-radius:1rem;background:#fff8df}.integration p{margin:.25rem 0 0;color:var(--muted);font-size:.9rem}.integration .button,.integration .primary{flex:none;margin:0}
.help{margin-top:4rem}.help h2{font-size:1.7rem}.help-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1rem}.help-card{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:1.25rem}.help-card h3{margin:.2rem 0}.path{display:inline-block;background:#eef2f8;border-radius:.4rem;padding:.35rem .55rem;font-size:.85rem;margin:.7rem 0}.help-card p{color:var(--muted);font-size:.92rem}.report-selection{max-width:48rem}.report-card{display:flex;align-items:center;gap:1rem;background:#fff;border:1px solid var(--line);border-radius:1rem;padding:1.2rem;margin:.8rem 0;cursor:pointer;transition:.15s}.report-card:hover{border-color:#90a9df;transform:translateY(-1px);box-shadow:0 8px 24px rgba(32,48,85,.08)}.report-card input{accent-color:var(--brand)}.report-card strong,.report-card small{display:block}.report-card small{color:var(--muted);margin-top:.25rem}.arrow{margin-left:auto}.back{display:inline-block;margin-bottom:2rem}.history{margin-top:3rem}.result-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1.5rem;margin-bottom:1rem}.result-head h1{margin:.1rem 0 .35rem;font-size:1.7rem}.result-head p{margin:0;color:var(--muted)}.result-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.6rem}.icon-button{display:grid;place-items:center;width:2.75rem;height:2.75rem;margin:0;padding:0;border:1px solid var(--line);border-radius:.7rem;background:#fff;color:var(--ink);cursor:pointer;transition:.15s}.icon-button:hover{border-color:#9eacd0;background:#f5f8ff;color:var(--brand);transform:translateY(-1px)}.icon-button.primary-icon{border-color:transparent;background:var(--brand);color:#fff}.icon-button.primary-icon:hover{background:#1f57c6;color:#fff}.icon-button svg{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.action-status{min-height:1.3em;margin:.5rem 0;color:var(--muted);font-size:.9rem;text-align:right}.preview-frame{width:100%;min-height:75vh;border:1px solid var(--line);border-radius:.5rem}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.7rem;border-bottom:1px solid var(--line)}iframe{background:#fff}@media(max-width:45rem){.result-head{display:block}.result-actions{justify-content:flex-start;margin-top:1rem}.action-status{text-align:left}}
</style>{% block head %}{% endblock %}</head><body><main><div class="topbar"><a href="{% url 'reports:dashboard' %}" aria-label="SilverLists Web – Startseite"><img class="brand-logo" src="{% static 'reports/brand/silverlists-web-logo.png' %}" alt="SilverLists Web"></a><div class="topbar-actions">{% block topbar_actions %}{% endblock %}</div></div>{% block content %}{% endblock %}</main></body></html>
