services:
  silverlists-web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: silverlists-web:${SILVERLISTS_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${SILVERLISTS_PORT:-8000}:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY muss gesetzt sein}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      SILVERLISTS_BASE_URL: ${SILVERLISTS_BASE_URL:-http://localhost:8000/}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_TRUST_PROXY_HTTPS: ${DJANGO_TRUST_PROXY_HTTPS:-true}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-true}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-true}
      SILVERLISTS_MAX_UPLOAD_MB: ${SILVERLISTS_MAX_UPLOAD_MB:-100}
      SILVERLISTS_PRODUCT_IMAGE_DIR: ${SILVERLISTS_PRODUCT_IMAGE_DIR:-/product-images}
      SILVERLISTS_PRODUCT_IMAGE_MAX_PIXELS: ${SILVERLISTS_PRODUCT_IMAGE_MAX_PIXELS:-480}
      SILVERLISTS_PRODUCT_IMAGE_JPEG_QUALITY: ${SILVERLISTS_PRODUCT_IMAGE_JPEG_QUALITY:-82}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-180}
    volumes:
      - silverlists-data:/data
      - ${SILVERLISTS_PRODUCT_IMAGE_HOST_DIR:-./product-images}:/product-images:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  silverlists-data:
